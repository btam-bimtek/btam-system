  <style>
    .form-input {

    .btn-secondary:hover { background: #e5e7eb; }
    .step-dot { width: 2rem; height: 2rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
